services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blade_agent_stack
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blade_agent_stack"]
      interval: 1s
      timeout: 3s
      retries: 30
