name: Release

# The version comes from the tag, never from commit types: pushing one annotated
# or lightweight `v<major>.<minor>.<patch>` tag publishes exactly that version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v<major>.<minor>.<patch> tag to publish'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/blade_agent_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blade_agent_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blade_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # A manual run must build the tag it names, not the branch it ran from.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.14'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stamp before anything is built or packed: the bundler inlines
      # package.json, so building first would ship the previous version into the
      # runtime (and into the tarball's manifest).
      - name: Stamp the release version
        run: node scripts/release-from-tag.mjs --stamp-only --tag "${{ inputs.tag || github.ref_name }}"

      - name: Resolve immutable Docker test image
        run: |
          docker pull alpine:3.22
          echo "TEST_DOCKER_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' alpine:3.22)" >> "$GITHUB_ENV"

      - name: Validate changelog fragments
        run: pnpm run changelog:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      - name: Verify package surfaces
        run: |
          node scripts/verify-entrypoints.mjs
          node scripts/verify-minimal-install.mjs

      - name: Verify generated Agent starter
        run: pnpm run verify:create-agent

      - name: Verify production Golden Path
        run: pnpm run verify:production-example

      - name: Verify Runtime regression metrics
        run: pnpm run verify:runtime-regression

      - name: Upload Runtime regression report
        if: ${{ always() && hashFiles('artifacts/runtime-regression.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: runtime-regression-release
          path: artifacts/runtime-regression.json
          retention-days: 90

      - name: Build documentation
        run: pnpm run docs:build

      - name: Test
        run: pnpm run test

      - name: Release
        run: node scripts/release-from-tag.mjs --tag "${{ inputs.tag || github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
