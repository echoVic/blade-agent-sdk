name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify
        run: pnpm run verify

      - name: Capture latest release tag
        run: |
          git fetch --tags --force
          previous_release_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          echo "PREVIOUS_RELEASE_TAG=$previous_release_tag" >> "$GITHUB_ENV"

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published artifacts
        run: |
          git fetch --tags --force
          published_version="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$published_version" ]; then
            echo "No v* release tag found; skipping post-publish verification."
            exit 0
          fi
          if [ "$published_version" = "$PREVIOUS_RELEASE_TAG" ]; then
            echo "No new release tag detected; skipping post-publish verification."
            exit 0
          fi
          pnpm run verify:published -- --version "$published_version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
