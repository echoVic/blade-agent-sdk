name: CI

on:
  push:
    branches:
      - main
      - master
      - 'refactor/**'
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/blade_agent_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blade_agent_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blade_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changelog fragments
        run: pnpm run changelog:check

      - name: Require changelog fragment for releasable changes
        if: github.event_name == 'pull_request'
        run: pnpm run changelog:check -- --base "${{ github.event.pull_request.base.sha }}"

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      - name: Build documentation
        run: pnpm run docs:build

      - name: Test
        run: pnpm run test

  native-lock:
    name: Native lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native file locks
        run: >-
          pnpm exec vitest run
          src/context/storage/__tests__/JSONLStore.test.ts
          src/session/events/__tests__/JsonlDurableEventStore.test.ts
          src/session/events/__tests__/JsonlDurableEventStoreCompromise.test.ts
          src/session/events/__tests__/JsonlDurableEventStoreUnavailableLock.test.ts
          src/agent/subagents/__tests__/AgentSessionStore.test.ts
          src/tools/builtin/shell/__tests__/BackgroundShellManager.test.ts
          src/hooks/__tests__/SecureProcessExecutor.test.ts
