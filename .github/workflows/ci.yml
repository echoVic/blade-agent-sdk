name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: npx biome ci --formatter-enabled=false --organize-imports-enabled=false src packages || echo "Lint issues detected (non-blocking for fixable warnings)"
        continue-on-error: true

      - name: Type-check (root)
        run: pnpm run type-check

      - name: Type-check (packages)
        run: pnpm -r run type-check

      - name: Boundary check
        run: pnpm run verify:boundaries

      - name: Entrypoint verification
        run: pnpm run verify:entrypoints

      - name: Package verification
        run: pnpm run verify:packages

      - name: Release config check
        run: pnpm run verify:release

      - name: Unit tests
        run: pnpm run test:unit

      - name: Package tests
        run: pnpm run test:packages

      - name: Build all packages
        run: pnpm -r run build
