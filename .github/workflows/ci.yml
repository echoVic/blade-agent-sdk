name: CI

on:
  push:
    branches:
      - main
      - master
      - 'refactor/**'
      - 'codex/**'
  pull_request:

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changelog fragments
        run: pnpm run changelog:check

      - name: Require changelog fragment for releasable changes
        if: github.event_name == 'pull_request'
        run: pnpm run changelog:check -- --base "${{ github.event.pull_request.base.sha }}"

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      - name: Build documentation
        run: pnpm run docs:build

      - name: Test
        run: pnpm run test

  native-lock:
    name: Native lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native durable locks
        run: >-
          pnpm exec vitest run
          src/session/events/__tests__/JsonlDurableEventStore.test.ts
          src/session/events/__tests__/JsonlDurableEventStoreCompromise.test.ts
          src/session/events/__tests__/JsonlDurableEventStoreUnavailableLock.test.ts
